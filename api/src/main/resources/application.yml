spring:
  application:
    name: api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/triplog}
    username: ${SPRING_DATASOURCE_USERNAME:triplog}
    password: ${SPRING_DATASOURCE_PASSWORD:triplog}
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
    bucket-photos: ${MINIO_BUCKET_PHOTOS:triplog-photos}
    bucket-tiles: ${MINIO_BUCKET_TILES:triplog-tiles}
  ai:
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    mock: ${AI_MOCK:true}
