services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-triplog}
      POSTGRES_USER: ${POSTGRES_USER:-triplog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-triplog}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-triplog} -d ${POSTGRES_DB:-triplog}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_PHOTOS: ${MINIO_BUCKET_PHOTOS:-triplog-photos}
      MINIO_BUCKET_TILES: ${MINIO_BUCKET_TILES:-triplog-tiles}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET_PHOTOS &&
      mc mb --ignore-existing local/$$MINIO_BUCKET_TILES &&
      exit 0
      "

  api:
    build:
      context: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-triplog}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-triplog}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-triplog}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_PHOTOS: ${MINIO_BUCKET_PHOTOS:-triplog-photos}
      MINIO_BUCKET_TILES: ${MINIO_BUCKET_TILES:-triplog-tiles}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MOCK: ${AI_MOCK:-true}
      CORS_ALLOWED_ORIGIN: http://localhost:${WEB_PORT:-5173}
    ports:
      - "${API_PORT:-8080}:8080"
      - "${API_DEBUG_PORT:-5005}:5005"
    volumes:
      - ./api:/app
      - api_gradle_cache:/root/.gradle

  web:
    build:
      context: ./web
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules

volumes:
  db_data:
  minio_data:
  api_gradle_cache:
  web_node_modules:
